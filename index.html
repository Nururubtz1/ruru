<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cek Khodam Pendamping | Sistem Deteksi Canggih</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #0b111e;
            color: #ffffff;
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        .khodam-container {
            background: rgba(18, 26, 47, 0.8);
            border: 1px solid #00d2ff;
            border-radius: 20px;
            padding: 40px 30px;
            box-shadow: 0 0 30px rgba(0, 210, 255, 0.1);
            max-width: 500px;
            width: 90%;
            text-align: center;
            position: relative;
        }

        .title-glitch {
            font-family: 'Share Tech Mono', monospace;
            color: #00d2ff;
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 5px;
            text-shadow: 0 0 10px rgba(0, 210, 255, 0.5);
        }

        .subtitle {
            color: #a0aabf;
            font-size: 0.9rem;
            margin-bottom: 30px;
        }

        .form-control {
            background-color: #05080f;
            border: 1px solid #3a4b70;
            color: #fff;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            font-size: 1.1rem;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            background-color: #05080f;
            color: #fff;
            border-color: #00d2ff;
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.3);
        }

        .btn-scan {
            background-color: #00d2ff;
            color: #000;
            font-weight: 700;
            font-size: 1.1rem;
            border: none;
            border-radius: 10px;
            padding: 12px 30px;
            margin-top: 20px;
            width: 100%;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-scan:hover {
            background-color: #fff;
            color: #000;
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.6);
        }

        /* Area Hasil Analisis */
        #resultArea {
            display: none;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px dashed #3a4b70;
        }

        .loading-text {
            font-family: 'Share Tech Mono', monospace;
            color: #00d2ff;
            font-size: 1.2rem;
            animation: pulse 1s infinite;
        }

        .khodam-name {
            font-size: 2rem;
            font-weight: 700;
            color: #ff0055; /* Warna kontras buat nama khodam */
            text-shadow: 0 0 15px rgba(255, 0, 85, 0.4);
            margin: 15px 0;
            text-transform: uppercase;
        }

        .khodam-desc {
            color: #a0aabf;
            font-size: 0.95rem;
            font-style: italic;
        }

        @keyframes pulse {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }
    </style>
</head>
<body>

    <div class="khodam-container">
        <h1 class="title-glitch">CEK KHODAM</h1>
        <p class="subtitle">Sistem Deteksi Entitas Gaib Berbasis AI (Akal-akalan Ilusi)</p>

        <div class="input-group-custom">
            <input type="text" id="namaInput" class="form-control" placeholder="Masukkan Nama Lengkapmu..." autocomplete="off">
            <button class="btn-scan" onclick="cekKhodam()">Analisis Sekarang</button>
        </div>

        <div id="resultArea">
            <div id="loading" class="loading-text">Menyinkronkan gelombang aura...</div>
            <div id="khodamResult" style="display: none;">
                <p class="text-white mb-1">Entitas yang mendampingi saudara <strong id="namaUser" class="text-info"></strong> adalah:</p>
                <div class="khodam-name" id="namaKhodam"></div>
                <p class="khodam-desc" id="descKhodam"></p>
                <button class="btn btn-outline-info btn-sm mt-3" onclick="resetForm()">Cek Nama Lain</button>
            </div>
        </div>
    </div>

    <script>
        // Database Khodam Absurd (Lu bisa tambahin sendiri di sini)
        const dataKhodam = [
            { nama: "Macan Handil Bakti", desc: "Sangat ganas jika lapar, namun sering mengantuk saat nugas." },
            { nama: "Motherboard Konslet", desc: "Suka mengeluarkan percikan ide, tapi rawan nge-hang kalau kebanyakan mikir." },
            { nama: "Sekretaris KPU FTI", desc: "Aura kepemimpinan yang kuat, ahli dalam menyusun proposal, tapi sering keteteran di hari H." },
            { nama: "Naga Ngesot", desc: "Kuat dan berwibawa, sayangnya mageran dan lebih suka rebahan." },
            { nama: "Supra Bapak", desc: "Memiliki getaran mesin yang mistis, melambangkan ketahanan banting seorang anak rantau." },
            { nama: "Rice Cooker Lupa Dicolok", desc: "Menebarkan aura PHP (Pemberi Harapan Palsu) yang sangat menyakitkan." },
            { nama: "Kucing Oren Kosan", desc: "Sifatnya bar-bar, tak kenal takut, pemakan segala lauk sisa." },
            { nama: "Flashdisk Isi Virus", desc: "Terlihat sangat membantu di luar, namun menghancurkan segalanya dari dalam." },
            { nama: "Kalkulator Warteg", desc: "Sangat akurat dalam menghitung pengeluaran akhir bulan." },
            { nama: "Kipas Angin Cosmos", desc: "Membawa kesejukan, tapi sering geleng-geleng kepala melihat tingkah lakumu." }
        ];

        function cekKhodam() {
            const inputName = document.getElementById('namaInput').value.trim();
            const resultArea = document.getElementById('resultArea');
            const loading = document.getElementById('loading');
            const khodamResult = document.getElementById('khodamResult');

            if (inputName === "") {
                alert("Isi namamu dulu, bree! Khodamnya bingung mau nyari siapa.");
                return;
            }

            // Tampilkan area hasil dan loading
            resultArea.style.display = 'block';
            loading.style.display = 'block';
            khodamResult.style.display = 'none';

            // Animasi pura-pura loading selama 2 detik
            setTimeout(() => {
                // Pilih khodam acak dari array
                const randomMistik = Math.floor(Math.random() * dataKhodam.length);
                const khodamTerpilih = dataKhodam[randomMistik];

                // Tampilkan data ke HTML
                document.getElementById('namaUser').innerText = inputName;
                document.getElementById('namaKhodam').innerText = khodamTerpilih.nama;
                document.getElementById('descKhodam').innerText = '"' + khodamTerpilih.desc + '"';

                // Hilangkan loading, munculkan hasil
                loading.style.display = 'none';
                khodamResult.style.display = 'block';
            }, 2000);
        }

        function resetForm() {
            document.getElementById('namaInput').value = "";
            document.getElementById('resultArea').style.display = 'none';
        }
    </script>

</body>
</html>
